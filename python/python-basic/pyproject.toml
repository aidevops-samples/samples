[project]
name = "python-basic"
version = "0.1.0"
description = "aidevops.kr Python 기본 가이드의 예제 프로젝트"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
python-basic = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# src 레이아웃의 app 패키지를 설치 가능한 패키지로 만든다 (uv sync가 편집 가능 모드로 설치)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
